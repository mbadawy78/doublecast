name: legal_health
title: Legal & health
description: >
  Case and file numbers, court references, patient and medical-record
  identifiers. Diagnoses and clinical details are deliberately NOT swapped:
  changing them would change the meaning of the question. Protect the
  identity of the person instead (names, IDs, dates of birth).

patterns:
  - name: case_number
    category: ID
    regex: '\b(?:case|file|docket|υπόθεση|υπόθεσης|Aktenzeichen|affaire|dossier|causa|fascicolo|expediente)\s*{MARKER}\s*[:#]?\s*([A-Z0-9][A-Z0-9./-]{2,})'
    group: 1
  - name: filing_reference
    category: ID
    regex: '\b(?:αριθμός κατάθεσης|αρ\.? κατ\.|Az\.|RG n°|autos)\s*[:#]?\s*([A-Z0-9][A-Z0-9./-]{2,})'
    group: 1
  - name: court_decision
    category: ID
    regex: '\b(?:decision|απόφαση|απόφασης|Urteil|Beschluss|arrêt|jugement|sentenza|sentencia)\s*{MARKER}\s*[:#]?\s*(\d+\s*/\s*\d{2,4})'
    group: 1
  - name: patient_id
    category: ID
    regex: '\b(?:patient|MRN|medical record|ασθενής|ασθενούς|αρ\.? μητρώου ασθενούς|φάκελος ασθενούς|Patient(?:en)?(?:nummer)?|patient|paziente|paciente)\s*(?:id|no\.?|nr\.?|#|αρ\.?|n°)?\s*[:#]?\s*([A-Z]{0,4}\d{4,})'
    group: 1
  - name: insurance_policy
    category: ID
    regex: '\b(?:policy|insurance|ασφαλιστήριο|συμβόλαιο|Police|Versicherungsnummer|police d.assurance|polizza|póliza)\s*{MARKER}?\s*[:#]?\s*([A-Z0-9][A-Z0-9/-]{4,})'
    group: 1
  - name: prescription_id
    category: ID
    regex: '\b(?:prescription|συνταγή|συνταγής|Rezept|ordonnance|ricetta|receta)\s*{MARKER}?\s*[:#]?\s*(\d{6,})'
    group: 1

money_headers: [fee, fees, claim, damages, settlement, compensation, αμοιβή, αποζημίωση, συμβιβασμός,
  honorar, schadenersatz, honoraires, dommages, onorario, risarcimento, honorarios, indemnización]
quantity_headers: [dose, dosage, mg, ml, δόση]
