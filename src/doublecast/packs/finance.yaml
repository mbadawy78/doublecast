name: finance
title: Finance & accounting
description: >
  Invoices, account numbers, SWIFT/BIC, contract and deal references,
  cheque numbers. IBANs, VAT numbers and payment cards are always covered
  by the core detectors.

patterns:
  - name: invoice_number
    category: ID
    regex: '\b(?:invoice|inv\.?|τιμολόγιο|τιμολογίου|τιμ\.|Τ\.?Π\.?Υ\.?|Rechnung|facture|fattura|factura)\s*{MARKER}?\s*[:#]?\s*([A-Z0-9][A-Z0-9/-]{3,})'
    group: 1
  - name: bank_account
    category: ID
    regex: '\b(?:account|acct\.?|a/c|λογαριασμός|λογαριασμού|λογ\.|Konto(?:nummer)?|compte|conto|cuenta)\s*{MARKER}?\s*[:#]?\s*(\d[\d -]{5,}\d)'
    group: 1
  - name: swift_bic
    category: ID
    regex: '\b(?:SWIFT|BIC)\s*(?:code)?\s*[:#]?\s*([A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?)\b'
    group: 1
    ignore_case: false
    require_digit: false
  - name: contract_reference
    category: ID
    regex: '\b(?:contract|agreement|σύμβαση|σύμβασης|σύμβ\.|Vertrag|contrat|contratto|contrato)\s*{MARKER}?\s*[:#]?\s*([A-Z0-9][A-Z0-9/-]{3,})'
    group: 1
  - name: cheque_number
    category: ID
    regex: '\b(?:cheque|check|επιταγή|επιταγής|Scheck|chèque|assegno|cheque)\s*{MARKER}?\s*[:#]?\s*(\d{6,})'
    group: 1
  - name: loan_reference
    category: ID
    regex: '\b(?:loan|δάνειο|δανείου|Darlehen|prêt|prestito|préstamo)\s*{MARKER}\s*[:#]?\s*([A-Z0-9][A-Z0-9/-]{3,})'
    group: 1

money_headers: [amount, balance, debit, credit, total, net, gross, vat, tax, fee, interest, principal,
  ebitda, ebit, cash, payable, receivable, ποσό, υπόλοιπο, χρέωση, πίστωση, σύνολο, καθαρό, μικτό, φπα,
  τόκος, κεφάλαιο, betrag, saldo, soll, haben, montant, solde, débit, crédit, importo, saldo, dare, avere,
  importe, saldo, debe, haber]
quantity_headers: []
