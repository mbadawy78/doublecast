name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  leak-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Benchmark must show zero leaks for listed values
        shell: bash
        run: |
          doublecast bench -n 100 -o bench.md
          python - <<'EOF'
          import re, sys
          text = open("bench.md", encoding="utf-8").read()
          bad = [l for l in text.splitlines()
                 if l.startswith("| ") and "UNLISTED" not in l and re.search(r"\| [1-9]\d* \| [\d.]+% \|$", l)]
          if bad:
              print("Leaks found:\n" + "\n".join(bad)); sys.exit(1)
          print("No leaks for listed values.")
          EOF
